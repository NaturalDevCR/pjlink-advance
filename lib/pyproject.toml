[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pjlink-advance"
version = "0.1.0"
description = "Asyncio PJLink Class 1 and Class 2 client with search, status notifications and a projector emulator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Josue" }]
keywords = ["pjlink", "projector", "asyncio", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/pjlink_advance"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
